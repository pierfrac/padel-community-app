name: Windows Launcher Check

on:
  push:
    branches:
      - develop
    paths:
      - 'windows/*.ps1'
      - 'windows/**/*.ps1'
      - '.github/workflows/windows-launcher-check.yml'
  pull_request:
    paths:
      - 'windows/*.ps1'
      - 'windows/**/*.ps1'
      - '.github/workflows/windows-launcher-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-syntax:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Parse Windows PowerShell scripts
        shell: pwsh
        run: |
          $files = @(
            'windows/flutter-launcher.ps1',
            'windows/panel.ps1'
          )

          foreach ($file in $files) {
            $path = Join-Path $env:GITHUB_WORKSPACE $file
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $path,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null

            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object {
                Write-Error ("{0}: {1}:{2} {3}" -f $file, $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message)
              }
            } else {
              Write-Host "PowerShell syntax OK: $file"
            }
          }
